name: Release

# Manual only. Tagged from package.json's version, so bump it (and tauri.conf.json's) before running
# again — a second run on the same version fails at `gh release create` rather than overwriting.
# No updater and no signing: this is a plain download page, not an auto-update channel.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu: the glibc the AppImage links against is the minimum it runs on.
          - os: ubuntu-22.04
            bundles: appimage,deb
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf build-essential file

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      - run: pnpm tauri build --bundles ${{ matrix.bundles }}

      # The bare exe is the genuinely portable Windows artifact (see CLAUDE.md, build:portable);
      # the same binary the installer wraps, so no second build is needed.
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir out
          version=$(node -p "require('./package.json').version")
          if [ "$RUNNER_OS" = Windows ]; then
            cp src-tauri/target/release/bundle/nsis/*.exe out/
            cp src-tauri/target/release/timeline.exe "out/Timeline_${version}_x64-portable.exe"
          else
            cp src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/deb/*.deb out/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release create "v$version" out/* --title "Timeline v$version" --target "$GITHUB_SHA" \
            --notes "Windows: інсталятор (*-setup.exe) або портативний *-portable.exe (потрібен WebView2). Linux: AppImage або .deb."
